@if (nombre()) {
  <div class="marca">
    @if (logo(); as ruta) {
      <img [src]="ruta" alt="Logo del hospedaje" width="48" height="48" />
    }
    <div>
      <strong>{{ nombre() }}</strong>
      @if (ruc(); as numero) { <span>RUC {{ numero }}</span> }
      @if (direccion(); as lugar) { <span>{{ lugar }}</span> }
    </div>
  </div>
}
